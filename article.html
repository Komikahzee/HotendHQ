<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — Hotend HQ</title>
<meta name="description" content="A Hotend HQ article.">
<!-- Live renderer for drafts and just-published articles. Built articles live at /guides/<slug>/ -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://hotendhq.com/article">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script src="assets/js/config.js" defer></script>
<script src="assets/js/nav.js?v=2" defer></script>
<script src="assets/js/site.js?v=2" defer></script>
<script src="assets/js/data-articles.js?v=2" defer></script>
<script src="assets/js/md.js" defer></script>
<script src="assets/js/render.js?v=1" defer></script>
<script src="assets/js/api.js?v=2" defer></script>
</head>
<body>
<main id="main">
  <article class="wrap section--tight" id="art">
    <div class="spin"></div>
  </article>
  <section class="wrap section" id="related-wrap" hidden>
    <div class="sec-head"><span class="eyebrow">Keep reading</span><h2>Related</h2></div>
    <div class="grid g3" id="related"></div>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = s => document.querySelector(s);
  const slug = new URLSearchParams(location.search).get('a');
  if (!slug) { location.replace('/news'); return; }

  let a;
  try { a = await HHQ_API.getArticle(slug); } catch {}
  if (!a) {
    $('#art').innerHTML = `<div class="empty">${icon('search')}
      <h2>Article not found</h2>
      <p>It may have been unpublished or the link may be wrong.</p>
      <a class="btn btn-ghost" href="/news" style="margin-top:14px">Back to all articles</a></div>`;
    return;
  }

  document.title = a.seo_title || (a.title + ' — Hotend HQ');
  const d = document.querySelector('meta[name=description]');
  if (d) d.content = a.meta_description || a.excerpt || '';
  if (a.status !== 'draft') document.querySelector('link[rel=canonical]').href =
    HHQ_CONFIG.baseUrl + '/guides/' + encodeURIComponent(a.slug) + '/';

  $('#art').innerHTML = HHQ_RENDER.article(a);

  $('#share').addEventListener('click', async () => {
    const url = location.href;
    if (navigator.share) { try { await navigator.share({ title:a.title, url }); return; } catch {} }
    try { await navigator.clipboard.writeText(url); HHQ.toast('Link copied.'); }
    catch { HHQ.toast('Copy the address bar link.', 'warn'); }
  });

  /* related: same category first, then anything else */
  try {
    const rel = HHQ_RENDER.related(a, await HHQ_API.listArticles({ limit:60 }));
    if (rel.length) {
      document.getElementById('related').innerHTML = rel.map(postCard).join('');
      document.getElementById('related-wrap').hidden = false;
    }
  } catch {}
});
</script>
</body>
</html>
